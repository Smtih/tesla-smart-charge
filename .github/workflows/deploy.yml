name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd ~/tesla-app
            # Fail if there are local changes that would block pull
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Local changes detected on server. Stash or commit them first."
              git status
              exit 1
            fi
            git pull
            sudo docker compose build app
            sudo docker compose up -d --remove-orphans
