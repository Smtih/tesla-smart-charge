version: "3.8"

services:
  fleet-telemetry:
    image: tesla/fleet-telemetry:latest
    ports:
      - "4443:4443"
    volumes:
      - ./fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      - ./certs:/certs:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./public-key.pem:/usr/share/nginx/html/.well-known/appspecific/com.tesla.3p.public-key.pem:ro
      - ./certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  vehicle-command-proxy:
    image: tesla/vehicle-command:latest
    ports:
      - "4430:443"
    volumes:
      - ./private-key.pem:/data/private-key.pem:ro
      - ./certs/fullchain.pem:/data/tls-cert.pem:ro
      - ./certs/privkey.pem:/data/tls-key.pem:ro
    environment:
      - TESLA_KEY_FILE=/data/private-key.pem
      - TESLA_HTTP_PROXY_TLS_CERT=/data/tls-cert.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/data/tls-key.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=443
      - TESLA_HTTP_PROXY_TIMEOUT=10s
    restart: unless-stopped

  app:
    build: .
    volumes:
      - ./.env:/app/.env:ro
      - ./private-key.pem:/app/private-key.pem:ro
      - ./token.json:/app/token.json
      - ./scheduled_charges.json:/app/scheduled_charges.json
      - ./vehicle_state.json:/app/vehicle_state.json
      - ./smart-charge.log:/app/smart-charge.log
    environment:
      - ZMQ_ENDPOINT=tcp://fleet-telemetry:5284
      - TESLA_REDIRECT_URI=https://smtih.duckdns.org/auth/callback
    depends_on:
      - fleet-telemetry
    restart: unless-stopped

